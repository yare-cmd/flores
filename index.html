<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Flores</title>
  <link rel="stylesheet" href="CSS/flores.css">
  <!-- Librería de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="contenedor">
    <h1>🌸 Catálogo de Flores</h1>

    <!-- Buscador -->
    <input type="text" id="buscador" placeholder="Buscar flor por nombre...">

    <!-- Formulario -->
    <form id="formFlora">
      <input type="hidden" id="idFlor">
      
      <label>Nombre:</label>
      <input type="text" id="nombre" required>

      <label>Descripción:</label>
      <textarea id="descripcion" rows="3"></textarea>

      <label>Costo ($):</label>
      <input type="number" step="0.01" id="costo" required>

      <label>Enlace de imagen:</label>
      <input type="url" id="imagen" placeholder="https://ejemplo.com/foto.jpg">

      <div class="botones">
        <button type="submit" id="btnGuardar">💾 Guardar</button>
        <button type="reset" id="btnCancelar" style="display:none;">❌ Cancelar</button>
      </div>
    </form>

    <!-- Lista de flores -->
    <h2>Lista de Flores</h2>
    <div id="listaFlores"></div>
  </div>

  <script src="JS/flores.js"></script>
</body>
</html>
